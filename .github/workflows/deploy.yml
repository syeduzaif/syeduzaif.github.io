name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No workflow-wide grants: each job declares the narrowest set it needs, so the
# build job (which runs untrusted code from fork PRs via `npm ci`) never holds
# the Pages or OIDC tokens.
permissions: {}

# One deploy at a time; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

# Third-party actions are pinned to a commit SHA, not a mutable tag: a tag can
# be repointed at new code by whoever owns the repo. Bump the SHA and the
# comment together when updating.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages GETs the Pages site to derive base_url/origin. Write is
      # only needed with `enablement: true`, which we do not set.
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (static export → ./out, then postbuild injects the CSP)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./out

  deploy:
    # Deploy only on pushes/dispatch to main — PRs run the checks above only.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
